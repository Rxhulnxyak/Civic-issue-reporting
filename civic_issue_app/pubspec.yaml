name: civic_issue_app
description: "जनसेतु - Crowdsourced Civic Issue Reporting & Resolution Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^14.2.7
  flutter_screenutil: ^5.9.3
  
  # State Management
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  
  # Backend & Database
  supabase_flutter: ^2.5.6
  http: ^1.2.2
  
  # Authentication
  supabase_auth: ^2.5.6
  
  # Location & Camera
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  
  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3
  url_launcher: ^6.3.1
  
  # Charts & Analytics
  fl_chart: ^0.69.0
  
  # File handling
  file_picker: ^8.0.6
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
